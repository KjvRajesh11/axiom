name: Axiom 2.1 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas matplotlib streamlit

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang llvm build-essential

      - name: Build C++ Project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Run C++ Workload Correctness Tests
        run: |
          ./build/axiom_correctness_tests

      - name: Run Python Unit & Integration Test Suite
        run: |
          pytest -v tests

      - name: Run Axiom CLI End-to-End Laboratories
        run: |
          python3 axiom_cli.py env
          python3 axiom_cli.py workloads
          python3 axiom_cli.py diff-asm matmul reference interchanged
          python3 axiom_cli.py run matmul --candidates reference,interchanged,neon,multithreaded --sizes 64,128 --warmup 2 --runs 5
          python3 axiom_cli.py regression-demo
          python3 axiom_cli.py memory-sweep
          python3 axiom_cli.py run ml_infer --sizes 8,32 --warmup 2 --runs 5
